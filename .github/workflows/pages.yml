name: Publish site

# Branch-based Pages can only serve the repo root or /docs. We want /docs for
# documentation, so the site is published from site/ by this workflow instead.
#
# This needs Settings → Pages → Source set to "GitHub Actions". If it is ever
# switched back to a branch, Pages serves /docs — which has no index.html — and
# the site 404s until the setting is restored.
#
# Published URLs: site/index.html → /, site/app/ → /app/.
#
# Every push to main redeploys, not just ones touching site/, so a deployment
# lost to a settings change comes back on the next push rather than waiting for
# the next site/ edit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
