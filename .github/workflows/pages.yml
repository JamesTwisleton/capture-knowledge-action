name: Publish site

# Branch-based Pages can only serve the repo root or /docs. We want /docs for
# documentation, so the site is published from site/ by this workflow instead.
#
# One-time repo setting: Settings → Pages → Source → "GitHub Actions".
# Published URLs are unchanged: site/index.html → /, site/app/ → /app/.

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
