name: CI

# Every ticket's acceptance criteria get a test that runs here. Unit tests prove the
# code; verify-acceptance.sh proves the thing the ticket actually promised.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  formatting:
    name: Java formatting (Spotless)
    runs-on: ubuntu-latest
    # Deliberately no `paths:` filter. This is a required check for merging, and GitHub leaves a
    # required check that never runs sitting as "expected" forever — a docs-only PR would be
    # unmergeable. Running it always costs a few seconds, and Spotless is scoped to Java by its
    # own configuration (the plugin declares only a <java> section), so nothing else is touched.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - run: mvn -B spotless:check
        working-directory: app/backend

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the reporter below publishes results as a check run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - run: mvn -B test
        working-directory: app/backend
      # Without this the log is the only place results exist, and a failure means scrolling a
      # job log to find which assertion broke. Surefire's XML carries each test's @DisplayName
      # (pom.xml configures that), so the check run reads as sentences and failures are
      # annotated on the diff itself.
      #
      # if: always() because the only run that matters is the one where `mvn test` just failed
      # — the default would skip the reporter exactly then. fail-on-error: false so a problem
      # publishing results cannot turn a green build red; the test step already owns that
      # verdict.
      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Backend test results
          path: app/backend/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
          # Defaults to true, which writes the report to the Actions job summary and creates no
          # check run at all — the results then live two clicks away under the Actions tab, and
          # nothing annotates the diff. false puts "Backend test results" in the PR's own check
          # list and marks failing assertions on the lines that caused them, which is the point.
          use-actions-summary: false

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend

  acceptance:
    name: Acceptance criteria (T01–T07)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: ./app/scripts/verify-acceptance.sh
