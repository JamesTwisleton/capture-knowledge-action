name: CI

# Every ticket's acceptance criteria get a test that runs here. Unit tests prove the
# code; verify-acceptance.sh proves the thing the ticket actually promised.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - run: mvn -B test
        working-directory: app/backend

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend

  acceptance:
    name: Acceptance criteria (T01–T03)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: ./app/scripts/verify-acceptance.sh
