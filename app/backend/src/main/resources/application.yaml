# Connection settings come from the environment, with defaults that work for a developer
# running the broker on their own machine. Compose sets EVENT_BUS_HOST to the service name
# and passes RABBITMQ_USER/RABBITMQ_PASS through from app/.env.
spring:
  rabbitmq:
    host: ${EVENT_BUS_HOST:localhost}
    port: ${EVENT_BUS_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

  # SQLite is a file, so "where is the database" is a path rather than a host and a port.
  #
  # The default is relative to app/backend, where Maven runs, and so resolves to app/data/db —
  # the directory the repository reserves for runtime data and gitignores, and the same one
  # Compose mounts at /data/db. The database therefore lands in one place on the host whether
  # the backend runs in a container or straight from a checkout, which is what lets you keep a
  # SQL client pointed at it across both. Compose sets DB_PATH to the absolute container path.
  #
  # Boot resolves the driver from the jdbc:sqlite: prefix, so no driver-class-name is needed,
  # and substituting another SQL database is this URL plus a migration path — see
  # persistence/AGENTS.md.
  datasource:
    url: jdbc:sqlite:${DB_PATH:../data/db/cka.db}
    hikari:
      # One connection, deliberately. SQLite takes a single write lock on the whole file, so a
      # larger pool cannot add write concurrency — it converts waiting into SQLITE_BUSY errors
      # on whichever connection loses. A pool of one makes the driver queue instead.
      maximum-pool-size: 1

  # Migrations live in the same repository as the schema they create and are applied at startup,
  # so a database is never a version behind the code that reads it. T14's audit columns and T11's
  # prompt table each arrived as a new file here, never by editing one Flyway has already applied
  # and checksummed — not even its comments, which are part of the checksum.
  flyway:
    locations: classpath:db/migration

# /actuator/health answers one question — is the backend itself up — because that is what the
# Compose healthcheck and T04's connectivity slice read it as. Boot would otherwise fold the
# broker's reachability into it, so a RabbitMQ hiccup would fail the container healthcheck,
# have Docker restart a perfectly healthy backend, and turn T04's page red for a dependency
# outage. A provider being unreachable is reported through EventBus.checkHealth() instead, which
# is what the front end's provider status view (T16) is built on. The same rule applies to every
# provider added later — see provider/AGENTS.md.
management:
  endpoints:
    web:
      exposure:
        # health, because the Compose healthcheck and T04 read it; flyway, because it is how the
        # T10 acceptance check asks the running backend which migrations it applied. Boot ships
        # that endpoint, so the alternative was a sqlite3 binary in the image purely to let a
        # test read one table. Both are read-only.
        include: health,flyway
  health:
    rabbit:
      enabled: false
    # Same rule, same reason: Boot adds a "db" indicator for the DataSource, and a database the
    # audit store cannot reach is a provider problem for the front end to show, not grounds for
    # Docker to restart a backend that is answering requests. AuditStore.checkHealth() reports it.
    db:
      enabled: false

# Which implementation satisfies each provider interface. One key per capability, matching
# the convention in provider/AGENTS.md, so a new implementation is selected by configuration
# rather than by editing the core. Override any of them with CKA_PROVIDER_<CAPABILITY>.
cka:
  provider:
    eventbus: rabbitmq
    audit: sql
    # T06. Needs a directory rather than a credential, so unlike the LLM it ships selected.
    knowledge: markdown-vault
    prompt: sql
    # T12, and the one capability that ships switched *off*. Every other provider here can
    # satisfy itself from the stack alone; this one needs a credential nobody has on a fresh
    # clone, and selecting it without one is a startup failure rather than a degraded service.
    # So `docker compose up` works immediately, and `CKA_PROVIDER_LLM=langchain4j` in app/.env
    # turns summarising on once LLM_API_KEY is set — which is what T20's ./setup.sh will write.
    llm: none

  # Where the Markdown vault writes (T06). Relative by default, for the same reason the
  # datasource URL above is: ../data/vault from the backend's working directory is app/data/vault,
  # the directory the repository reserves for runtime data and the same one Compose mounts at
  # /data/vault. The notes therefore land in one place on the host whether the backend runs in a
  # container or straight from a checkout, which is what lets a single Obsidian vault follow both.
  # Compose sets VAULT_PATH to the absolute container path.
  vault:
    path: ${VAULT_PATH:../data/vault}

  # How the LLM provider reaches a model (T12).
  llm:
    # Which LangChain4j binding talks to the model, and the default lives here rather than in
    # the annotation that reads it: one place says what CKA talks to by default, and a second
    # binding declares its own name instead of racing this one to back off — see provider/llm.
    vendor: ${LLM_VENDOR:anthropic}
    api-key: ${LLM_API_KEY:}
    # Recorded against every summary for the audit trail, so changing it changes attribution.
    model: ${LLM_MODEL:claude-sonnet-5}
    max-tokens: ${LLM_MAX_TOKENS:8192}
    # A 40-minute transcript is not a quick call; the SDK default is far shorter than this.
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
